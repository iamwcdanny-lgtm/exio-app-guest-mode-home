<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX.IO 3D Logo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500&family=Manrope:wght@400;600&display=swap">
<style>
  /* Layout: one full-height stage; title top-left, finish switch bottom-centre, hint bottom-right */
  :root {
    --stage: #FFFFFF;
    --ink: #17302C;
    --muted: #5D736F;
    --chip: rgba(244,248,247,.9);
    --chip-line: rgba(23,48,44,.12);
    --accent: #2FB894;
    --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
    --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  html, body { height: 100%; }
  body { background: var(--stage); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
  .stage { position: relative; height: 100%; min-height: 360px; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  canvas#gl:active { cursor: grabbing; }
  .ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .head h1 { margin: 0; font: 500 15px/1.2 var(--f-display); letter-spacing: .02em; }
  .head p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .seg { pointer-events: auto; display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip);
         border: 1px solid var(--chip-line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 600 13px/1 var(--f-body);
                padding: 9px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--stage); }
  .seg button:focus-visible, .reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  .reset { pointer-events: auto; appearance: none; border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink);
           font: 600 12px/1 var(--f-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; }
  .gap { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--muted);
         padding: 8px 14px; border-radius: 999px; background: var(--chip); border: 1px solid var(--chip-line); }
  .gap input { width: 120px; accent-color: var(--accent); }
  .gap output { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 13ch; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .switch { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; appearance: none; cursor: pointer;
            font: 600 13px/1 var(--f-body); color: var(--ink); padding: 6px 14px 6px 6px; border-radius: 999px;
            background: var(--chip); border: 1px solid var(--chip-line); }
  .switch .knob { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--chip-line); transition: background .2s; }
  .switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
  .switch[aria-checked="true"] .knob { background: var(--accent); }
  .switch[aria-checked="true"] .knob::after { transform: translateX(14px); }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ui { padding-bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); }
  @media (max-width: 560px) { .zoomhint { display: none; } }
  .status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted); pointer-events: none; }
</style>

<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="stage">
  <canvas id="gl" tabindex="0" aria-label="Interactive 3D EX.IO logo. Drag to rotate."></canvas>
  <div class="status" id="status">Loading model…</div>
  <div class="ui">
    <div class="head">
      <h1>EX.IO</h1>
      <p>Four stacked layers · drag to rotate</p>
    </div>
    <div class="foot">
      <div class="row">
      <div class="seg" role="group" aria-label="Finish">
        <button id="f-glass" type="button" aria-pressed="true" data-finish="glass">All glass</button>
        <button id="f-frost" type="button" aria-pressed="false" data-finish="frost">Frosted + metal</button>
      </div>
      <button class="switch" id="glass-hk" type="button" role="switch" aria-checked="false"><span class="knob" aria-hidden="true"></span>Glass reflects HK</button>
      </div>
      <label class="gap" for="gap-range">Layer spacing <input id="gap-range" type="range" min="0" max="1.2" step="0.01" value="0.21"> <output id="gap-val" for="gap-range">0.21</output></label>
      <div class="hint"><span class="zoomhint">Scroll or pinch to zoom</span><button class="reset" id="motion" type="button" hidden>Tilt with phone</button><button class="reset" id="reset" type="button">Reset view</button></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = '../public/models/exio_logo.glb';
const canvas = document.getElementById('gl');
const statusEl = document.getElementById('status');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.03).texture;
// Blurred daytime view of Victoria Harbour used for reflections (painted on a canvas,
// no image download): blue sky with clouds, the Peak's green ridge, the skyline with
// IFC, Bank of China Tower and ICC, and the harbour.
function cityEnvironment(pmrem) {
  const W = 2048, H = 1024, hz = H * 0.6;   // horizon set low so more of the view is sky and skyline
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = g.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, '#2E7BD6'); sky.addColorStop(0.5, '#6FAAE8'); sky.addColorStop(0.85, '#BBD8F2'); sky.addColorStop(1, '#E4EEF6');
  g.fillStyle = sky; g.fillRect(0, 0, W, hz);
  const sun = g.createRadialGradient(W * 0.3, H * 0.14, 0, W * 0.3, H * 0.14, 360);   // high sun
  sun.addColorStop(0, 'rgba(255,255,250,1)'); sun.addColorStop(0.2, 'rgba(255,252,235,0.7)'); sun.addColorStop(1, 'rgba(255,250,235,0)');
  g.fillStyle = sun; g.fillRect(0, 0, W, hz);
  for (let i = 0; i < 46; i++) {                                 // soft cumulus
    const x = rnd() * W, y = H * (0.12 + rnd() * 0.3), r = 30 + rnd() * 70;
    const cl = g.createRadialGradient(x, y, 0, x, y, r);
    cl.addColorStop(0, 'rgba(255,255,255,0.85)'); cl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = cl; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.fillStyle = '#4E7A5E';                                       // the Peak and the hills, green
  g.beginPath(); g.moveTo(0, hz);
  for (let x = 0; x <= W; x += 8) {
    const t = x / W * Math.PI * 2;
    g.lineTo(x, hz - H * (0.11 + 0.05 * Math.sin(t * 2 + 0.6) + 0.025 * Math.sin(t * 5 + 1.3) + 0.012 * Math.sin(t * 13)));
  }
  g.lineTo(W, hz); g.closePath(); g.fill();
  const tones = ['#C9D4DE', '#AFC0D0', '#E6ECF1', '#8FA6BC', '#D8D2C6', '#9DB8CF'];   // daylit glass and stone towers
  for (let x = 0; x < W;) {
    const w = 14 + rnd() * 40, tall = rnd() < 0.08;
    const h = (tall ? 0.16 + rnd() * 0.1 : 0.03 + rnd() * 0.08) * H;
    g.fillStyle = tones[Math.floor(rnd() * tones.length)]; g.fillRect(x, hz - h, w, h + 2);
    g.fillStyle = 'rgba(60,80,110,0.25)';
    for (let wy = hz - h + 5; wy < hz - 3; wy += 6) g.fillRect(x + 2, wy, w - 4, 1.5);
    x += w + rnd() * 6;
  }
  const tower = (x, w, h, col) => { g.fillStyle = col; g.fillRect(x, hz - h, w, h + 2); };
  tower(W * 0.30, 30, H * 0.30, '#B7C6D4'); tower(W * 0.30 + 4, 22, H * 0.315, '#B7C6D4'); tower(W * 0.30 + 8, 14, H * 0.33, '#B7C6D4');   // IFC 2
  g.fillStyle = '#7F98B2'; g.beginPath(); g.moveTo(W * 0.345, hz); g.lineTo(W * 0.345, hz - H * 0.2); g.lineTo(W * 0.345 + 18, hz - H * 0.26);
  g.lineTo(W * 0.345 + 36, hz - H * 0.22); g.lineTo(W * 0.345 + 36, hz); g.fill();                                                         // Bank of China Tower
  g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 2;
  for (let k = 0; k < 4; k++) { const y0 = hz - H * 0.05 * k; g.beginPath(); g.moveTo(W * 0.345, y0); g.lineTo(W * 0.345 + 36, y0 - H * 0.05); g.moveTo(W * 0.345 + 36, y0); g.lineTo(W * 0.345, y0 - H * 0.05); g.stroke(); }
  tower(W * 0.74, 44, H * 0.36, '#9FB3C8');                                                                                                 // ICC
  const water = g.createLinearGradient(0, hz, 0, H);
  water.addColorStop(0, '#7FA9C4'); water.addColorStop(0.25, '#3F7FA6'); water.addColorStop(1, '#1F5578');
  g.fillStyle = water; g.fillRect(0, hz, W, H - hz);
  g.globalAlpha = 0.25;                                          // sparkle on the water
  for (let i = 0; i < 300; i++) { g.fillStyle = '#FFFFFF'; g.fillRect(rnd() * W, hz + 4 + rnd() * H * 0.25, 4 + rnd() * 10, 1.5); }
  g.globalAlpha = 1;
  const b = document.createElement('canvas'); b.width = W; b.height = H;   // soft focus
  const bg = b.getContext('2d'); bg.filter = 'blur(10px)'; bg.drawImage(c, 0, 0);
  const tex = new THREE.CanvasTexture(b);
  tex.mapping = THREE.EquirectangularReflectionMapping; tex.colorSpace = THREE.SRGBColorSpace;
  const env = pmrem.fromEquirectangular(tex).texture; tex.dispose();
  return env;
}
const CITY_ENV = cityEnvironment(pmrem);   // Hong Kong, reflected by the metal layer only

function stageColor() { return getComputedStyle(document.body).backgroundColor; }
function syncBackground() { scene.background = new THREE.Color(stageColor()); }
syncBackground();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncBackground);
new MutationObserver(syncBackground).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
const HOME = new THREE.Vector3(-0.9, 0.8, 11.5);
camera.position.copy(HOME);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 7; controls.maxDistance = 22;
controls.rotateSpeed = 0.8;

// soft studio lights on top of the environment
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(-4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xe8f0ff, 1.2); rim.position.set(6, 2, -5); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfe3dd, 0.6));

// colour stops (top-left light → bottom-right deep), same as the renders
const RAMPS = {
  mint:   [[0, '#DDFBEA'], [.35, '#93EBC9'], [.7, '#4FD1A8'], [1, '#22A88A']],
  topGlass: [[0, '#FFFFFF'], [.5, '#F2FFF9'], [1, '#DDFBEF']],
  mintSolid: [[0, '#5EF0BE'], [.3, '#1FDCA0'], [.6, '#00C2B4'], [.85, '#1A9FE0'], [1, '#2A78E4']],
  violet: [[0, '#CF84CB'], [.3, '#C779D7'], [.6, '#AD60E0'], [1, '#7036E6']],
  clear:  [[0, '#F4F8FA'], [.5, '#DCE6EC'], [1, '#B9C8D2']],
  metal:  [[0, '#FFFFFF'], [.5, '#EEF2F5'], [1, '#CDD6DE']],
};
function sampleRamp(stops, t) {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const [p0, c0] = stops[i - 1], [p1, c1] = stops[i];
      return new THREE.Color(c0).lerp(new THREE.Color(c1), (t - p0) / (p1 - p0));
    }
  }
  return new THREE.Color(stops[stops.length - 1][1]);
}
function paint(mesh, stops) {
  const g = mesh.geometry, pos = g.attributes.position, v = new THREE.Vector3();
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
    const c = sampleRamp(stops, 0.5 + 0.05 * v.x - 0.55 * v.y);
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

const TOP_GLASS = () => new THREE.MeshPhysicalMaterial({ vertexColors: true, transmission: 1, thickness: 0.4, roughness: 0.04, ior: 1.5,
  clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.3, iridescenceIOR: 1.35, specularIntensity: 1 });
const FINISHES = {
  glass: {
    front: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.3, metalness: 0, envMapIntensity: 0.35,
      specularIntensity: 0.35, clearcoat: 0.7, clearcoatRoughness: 0.08 }),
    mid: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, transmission: 0.75, thickness: 0.3, roughness: 0.06, ior: 1.45,
      clearcoat: 1, clearcoatRoughness: 0.03, iridescence: 0.4 }),
    back: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, transmission: 1, thickness: 0.5, roughness: 0.05, ior: 1.45,
      clearcoat: 1, clearcoatRoughness: 0.03 }),
    ramps: ['mintSolid', 'violet', 'clear'],
  },
  frost: {
    front: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.3, metalness: 0, envMapIntensity: 0.35,
      specularIntensity: 0.35, clearcoat: 0.7, clearcoatRoughness: 0.08 }),
    mid: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, transmission: 0.5, thickness: 0.3, roughness: 0.28, ior: 1.45,
      clearcoat: 1, clearcoatRoughness: 0.05, iridescence: 0.35 }),
    back: () => new THREE.MeshPhysicalMaterial({ vertexColors: true, envMap: CITY_ENV, metalness: 1, roughness: 0.05, envMapIntensity: 1.4, clearcoat: 1, clearcoatRoughness: 0.02 }),
    ramps: ['mintSolid', 'violet', 'metal'],
  },
};

const pivot = new THREE.Group(); scene.add(pivot);
// extra air between the layers, along the viewing axis
let gap = 0.21;
function setGap(g) {
  gap = g;
  [topGlass, ...layers].filter(Boolean).forEach(m => {
    m.position.copy(m.userData.base).addScaledVector(m.userData.dir, gap * m.userData.i);
  });
}
let layers = [];   // [front, mid, back] meshes
let topGlass = null;   // clear glass copy of the front layer, sitting on top

// glass layers can reflect the Hong Kong view too (the metal layer always does)
let glassCity = false;
try { glassCity = localStorage.getItem('exio-glass-hk') === '1'; } catch (e) {}
function applyGlassReflection() {
  [topGlass, ...layers].forEach(m => {
    if (!m || m.material.metalness === 1) return;
    if (m.material.transmission > 0) { m.material.envMap = glassCity ? CITY_ENV : null; m.material.envMapIntensity = glassCity ? 2 : 1; m.material.needsUpdate = true; }
  });
  document.getElementById('glass-hk').setAttribute('aria-checked', String(glassCity));
}
document.getElementById('glass-hk').addEventListener('click', () => {
  glassCity = !glassCity;
  try { localStorage.setItem('exio-glass-hk', glassCity ? '1' : '0'); } catch (e) {}
  applyGlassReflection();
});

function applyFinish(name) {
  const f = FINISHES[name];
  const mats = [f.front(), f.mid(), f.back()];
  layers.forEach((m, i) => { paint(m, RAMPS[f.ramps[i]]); m.material.dispose?.(); m.material = mats[i]; });
  if (topGlass) { paint(topGlass, RAMPS.topGlass); topGlass.material.dispose?.(); topGlass.material = TOP_GLASS(); }
  applyGlassReflection();
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.finish === name)));
  try { localStorage.setItem('exio-finish', name); } catch (e) {}
}

new GLTFLoader().load(MODEL_URL, (gltf) => {
  const root = gltf.scene;
  pivot.add(root);
  root.updateMatrixWorld(true);
  const meshes = {};
  root.traverse(o => { if (o.isMesh) meshes[o.name.split('_')[0]] = o; });
  layers = ['L0', 'L1', 'L2'].map(k => meshes[k]).filter(Boolean);
  layers.forEach((m, i) => {
    const p = m.parent, o = p.worldToLocal(new THREE.Vector3(0, 0, 0));
    m.userData.dir = p.worldToLocal(new THREE.Vector3(0, 0, -1)).sub(o);   // "away from viewer" in the layer's own space
    m.userData.base = m.position.clone(); m.userData.i = i;
  });
  // line every layer up with the front one, left/right and top/bottom (only the depth step remains)
  {
    const p = layers[0].parent, o = p.worldToLocal(new THREE.Vector3(0, 0, 0));
    const xdir = p.worldToLocal(new THREE.Vector3(1, 0, 0)).sub(o), ydir = p.worldToLocal(new THREE.Vector3(0, 1, 0)).sub(o);
    const w0 = p.localToWorld(layers[0].userData.base.clone());
    layers.forEach(m => {
      const w = p.localToWorld(m.userData.base.clone());
      m.userData.base.addScaledVector(xdir, w0.x - w.x).addScaledVector(ydir, w0.y - w.y);
    });
  }
  // glass layer on top: a copy of the front shape, one step towards the viewer
  const L0 = layers[0], L1 = layers[1];
  topGlass = L0.clone(); topGlass.geometry = L0.geometry.clone(); topGlass.name = 'TopGlass';
  topGlass.userData = { dir: L0.userData.dir.clone(), base: L0.userData.base.clone().multiplyScalar(2).sub(L1.userData.base), i: -1 };
  L0.parent.add(topGlass);
  // second layer thinner: squash it along its depth axis (front face stays in place)
  const d = layers[1].userData.dir, ax = ['x', 'y', 'z'].reduce((b, k) => Math.abs(d[k]) > Math.abs(d[b]) ? k : b, 'x');
  layers[1].scale[ax] = 0.3;
  topGlass.scale[ax] = 0.3;   // thin glass sheet on top
  setGap(gap);
  // centre the stack in the view
  const box = new THREE.Box3().setFromObject(root);
  root.position.sub(box.getCenter(new THREE.Vector3()));
  root.updateMatrixWorld(true);
  pivot.rotation.y = -0.17;
  let start = 'glass';
  try { start = localStorage.getItem('exio-finish') || 'glass'; } catch (e) {}
  applyFinish(FINISHES[start] ? start : 'glass');
  statusEl.hidden = true;
}, undefined, () => { statusEl.textContent = 'The 3D model could not load. Serve the repo root (e.g. npx serve .) and open /reference/exio-logo-3d.html.'; });

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => layers.length && applyFinish(b.dataset.finish)));
function resetView() { camera.position.copy(HOME); controls.target.set(0, 0, 0); controls.update(); }
document.getElementById('reset').addEventListener('click', resetView);
const gapVal = document.getElementById('gap-val');
function showGap(g) { gapVal.textContent = g.toFixed(2) + ' u · ' + (g / 6 * 100).toFixed(1) + '% of width'; }
showGap(gap);
document.getElementById('gap-range').addEventListener('input', e => { const g = parseFloat(e.target.value); showGap(g); if (layers.length) setGap(g); });
canvas.addEventListener('dblclick', resetView);

// gentle tilt toward the pointer when idle
const tilt = new THREE.Vector2(), tiltTarget = new THREE.Vector2();
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && !gyroOn) tiltTarget.set((e.clientX / innerWidth - 0.5) * 0.25, (e.clientY / innerHeight - 0.5) * 0.18);
});

// phone tilt: turning the phone turns the logo, so the layers shift against each other like looking through a window
let gyroOn = false, base = null;
const motionBtn = document.getElementById('motion');
const DEG = Math.PI / 180, clamp = (v, a) => Math.max(-a, Math.min(a, v));
function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  let x = e.gamma, y = e.beta;                       // left/right, front/back in degrees
  const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  if (ang === 90) [x, y] = [e.beta, -e.gamma];
  else if (ang === -90 || ang === 270) [x, y] = [-e.beta, e.gamma];
  if (!base) base = { x, y };
  base.x += (x - base.x) * 0.004; base.y += (y - base.y) * 0.004;   // slowly re-centre on how the phone is held
  gyroOn = true; motionBtn.hidden = true;
  tiltTarget.set(clamp((x - base.x) * DEG * 1.1, 0.6), clamp((y - base.y) * DEG * 0.9, 0.45));
}
function startMotion() {
  const DOE = window.DeviceOrientationEvent;
  if (DOE && typeof DOE.requestPermission === 'function') {          // iOS: needs a tap, then asks
    DOE.requestPermission().then(r => {
      if (r === 'granted') addEventListener('deviceorientation', onOrient);
      else motionBtn.textContent = 'Motion access is off';
    }).catch(() => { motionBtn.textContent = 'Motion not available here'; });
  } else {
    addEventListener('deviceorientation', onOrient);
  }
}
if (window.DeviceOrientationEvent && matchMedia('(pointer: coarse)').matches) {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') motionBtn.hidden = false;  // iOS shows the button
  else startMotion();                                                                           // Android starts on its own
}
motionBtn.addEventListener('click', startMotion);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the whole word in frame on narrow screens
  camera.fov = w / h < 1.2 ? 30 * Math.min(2.1, 1.2 / (w / h)) : 30;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  tilt.lerp(tiltTarget, 0.05);
  if (!reduceMotion) {
    pivot.rotation.x = tilt.y + Math.sin(t * 0.6) * 0.03;
    pivot.rotation.y = -0.17 + tilt.x + Math.sin(t * 0.4) * 0.06;
    pivot.position.y = Math.sin(t * 0.8) * 0.05;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>

</body>
